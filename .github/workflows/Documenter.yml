name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to document"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Use current documentation deployment script
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main --depth=1
          git show origin/main:docs/make.jl > docs/make.jl

      - name: Instantiate documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Build and deploy documentation
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOOMEVENTS_DOC_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
